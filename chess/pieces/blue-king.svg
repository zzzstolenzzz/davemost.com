<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Dad: buzzed sides, big grin, v-neck tee, arms crossed, eagle tattoo, watch -->
  <!-- shoulders + v-neck tee -->
  <path d="M14 100 Q14 70 50 64 Q86 70 86 100 Z" fill="#fffef8"/>
  <path d="M42 64.5 L50 73 L58 64.5"/>
  <path d="M43 57 L43 65 M57 57 L57 65"/>
  <!-- crossed arms: back arm, then front arm with tattoo + watch -->
  <rect x="24" y="73" width="62" height="13" rx="6.5" fill="#fffef8"/>
  <path d="M76 76 Q80 74 82 77 M75 80 Q80 78 83 81" stroke-width="1.8"/>
  <rect x="12" y="82" width="64" height="14" rx="7" fill="#fffef8"/>
  <path d="M17 89 L23 85 L22 91 L28 86 L27 92 L33 87 M19 92 Q26 93 34 90" stroke-width="1.6"/>
  <path d="M47 82 L47 96 M51 82 L51 96" stroke-width="2.5"/>
  <rect x="45" y="85.5" width="8" height="7" rx="2.5" fill="currentColor" stroke-width="1.5"/>
  <!-- ears -->
  <path d="M35 38 Q27 35 28 42 Q29 49 36 47" fill="#fffef8"/>
  <path d="M65 38 Q73 35 72 42 Q71 49 64 47" fill="#fffef8"/>
  <!-- crown -->
  <path d="M41 25 L42 10 L46 16 L50 7 L54 16 L58 10 L59 25 Z" fill="#fffef8"/>
  <!-- head -->
  <ellipse cx="50" cy="43" rx="15.5" ry="18" fill="#fffef8"/>
  <!-- short spiky top, buzzed sides -->
  <path d="M35.5 37 Q35 27 43 24.5 Q50 22.5 57 24.5 Q65 27 64.5 37 Q61 32.5 57 32 L55 28.5 L52.5 31.5 L50 27.5 L47.5 31.5 L45 28.5 L43 32 Q39 32.5 35.5 37 Z" fill="currentColor" fill-opacity=".85" stroke-width="2.2"/>
  <!-- eyebrows -->
  <path d="M40 36.5 Q43.5 34.5 47 36.5 M53 36.5 Q56.5 34.5 60 36.5" stroke-width="3.4"/>
  <!-- eyes -->
  <circle cx="43.5" cy="41" r="3" fill="#fffef8" stroke-width="2"/>
  <circle cx="56.5" cy="41" r="3" fill="#fffef8" stroke-width="2"/>
  <g class="eyes"><circle cx="43.5" cy="41.3" r="1.7" fill="currentColor" stroke="none"/><circle cx="56.5" cy="41.3" r="1.7" fill="currentColor" stroke="none"/></g>
  <!-- nose -->
  <path d="M50 42.5 Q48 47.5 49.5 49 Q51.5 49.5 53 48.5" stroke-width="2"/>
  <!-- big toothy grin -->
  <path d="M40.5 50.5 Q50 53.5 59.5 50.5 Q57.5 59.5 50 59.5 Q42.5 59.5 40.5 50.5 Z" fill="#fffef8" stroke-width="2"/>
  <path d="M42.5 53.6 Q50 56.4 57.5 53.6" stroke-width="1.3"/>
</svg>
